<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — הדף לא נמצא | damages.co.il</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.error-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px}
.error-code{font-size:8rem;font-weight:800;color:var(--accent-gold);line-height:1;margin:0;opacity:.3}
.error-msg{font-size:1.5rem;color:var(--text-light);margin:20px 0 10px;font-weight:700}
.error-sub{color:var(--text-muted);margin-bottom:30px;max-width:400px}
.error-actions{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
.error-actions a{padding:12px 30px;border-radius:25px;text-decoration:none;font-weight:700;transition:all .2s}
.error-home{background:var(--accent-gold);color:#0a0a1e}
.error-wa{background:rgba(37,211,102,.15);color:#25d366;border:1px solid rgba(37,211,102,.3)}
.error-home:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(212,175,55,.4)}
.error-wa:hover{background:rgba(37,211,102,.25)}
</style>
</head>
<body>
<header class="main-header">
<div class="container">
<a href="/" style="text-decoration:none;color:inherit"><h1 style="margin:0;font-size:1.8rem">damages<span style="color:var(--accent-gold)">.co.il</span></h1></a>
</div>
</header>
<main class="error-wrap">
    <div class="error-code">404</div>
    <p class="error-msg">הדף שחיפשת לא נמצא</p>
    <p class="error-sub">ייתכן שהקישור שגוי או שהדף הועבר. אל דאגה — אנחנו כאן לעזור.</p>
    <div class="error-actions">
        <a href="/" class="error-home">→ חזרה לדף הבית</a>
        <a href="https://wa.me/972587008133?text=שלום%2C%20הגעתי%20לדף%20404%20באתר%20damages.co.il" target="_blank" class="error-wa">💬 צריך עזרה?</a>
    </div>
</main>
<nav class="app-bottom-bar" aria-label="סרגל ניווט תחתון">
        <a href="/" class="app-bar-item active">
            <span>🏠</span>
            <span>בית</span>
        </a>
        <a href="/#calculator" class="app-bar-item">
            <span>🧮</span>
            <span>מחשבון</span>
        </a>
        <a href="/#services" class="app-bar-item">
            <span>⚖️</span>
            <span>התמחות</span>
        </a>
        <a href="https://wa.me/972587008133?text=שלום%2C%20אני%20מגיע%20מסרגל%20הניווט%20באפליקציה" target="_blank" class="app-bar-item" style="color:#25D366">
            <span>💬</span>
            <span>ווצאפ</span>
        </a>
    </nav>

<script id="master-wa-router">
document.addEventListener("DOMContentLoaded", function() {
  const masterPhone = "972587008133";
  function updateWaLinks() {
    const pageTitle = document.title.split("|")[0].trim();
    const pageUrl = window.location.href;
    const calcResult = document.getElementById("calc-result") || document.querySelector(".calc-result, #result-amount");
    const calcText = (calcResult && calcResult.innerText.trim()) ? "\n• נתוני מחשבון: " + calcResult.innerText.trim().replace(/\n+/g, " ") : "";
    
    const msg = "שלום, אני פונה מפורטל damages.co.il לבדיקת זכאות ומימוש זכויות:\n\n" +
                "• עמוד מקור: " + pageTitle + "\n" +
                "• קישור: " + pageUrl + calcText + "\n\n" +
                "• מה קרה ומה אני מעוניין לתבוע?: " + "\n" +
                "• מתי קרה האירוע?: ";
                
    const encoded = encodeURIComponent(msg);
    document.querySelectorAll("a[href*=\"wa.me\"], a[href*=\"whatsapp.com\"]").forEach(a => {
      a.href = "https://wa.me/" + masterPhone + "?text=" + encoded;
    });
  }
  updateWaLinks();
  document.addEventListener("click", function(e) {
    if (e.target.closest("a[href*=\"wa.me\"], a[href*=\"whatsapp.com\"]")) {
      updateWaLinks();
    }
  });
});
</script>
</body>
</html>
