pages_build_output_dir = "public"

# ── D1 Database (shared hub-core) ────────────────
[[d1_databases]]
binding       = "DB"
database_name = "hub-core"
database_id   = "de33077c-fad2-48df-9f81-cdfa0f36945a"

# ── Environment Variables ────────────────────────
[vars]
SITE_NAME        = "damages.co.il"
TELEGRAM_CHAT_ID = "7726489288"
