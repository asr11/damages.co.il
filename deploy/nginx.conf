# damages.co.il — Nginx Production Config
# Copy to /etc/nginx/sites-available/damages.co.il
# ln -s /etc/nginx/sites-available/damages.co.il /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name damages.co.il www.damages.co.il;
    return 301 https://damages.co.il$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.damages.co.il;
    
    ssl_certificate /etc/letsencrypt/live/damages.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damages.co.il/privkey.pem;
    
    return 301 https://damages.co.il$request_uri;
}

server {
    listen 443 ssl http2;
    server_name damages.co.il;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/damages.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damages.co.il/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Root
    root /var/www/damages.co.il/public;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: upload.wikimedia.org; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets (1 year)
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Clean URLs — try directory/index.html first
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block content source markdown
    location /content/ {
        deny all;
    }
}
